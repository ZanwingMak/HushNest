name: Publish website
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/assemble-site.mjs', 'scripts/check-site.mjs', 'README.md', 'docs/DOWNLOADS.md', 'cross-platform/**', 'HushNest/Resources/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: cross-platform/package-lock.json }
      - run: npm ci --prefix cross-platform
      - run: npm run build --prefix cross-platform
      - run: node scripts/assemble-site.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: cross-platform
      - run: node scripts/check-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: HushNest-Website-QA
          path: build/site-qa
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
