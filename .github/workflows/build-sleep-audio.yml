name: Rebuild long sleep audio pack
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful public source download run ID
        required: true
        default: '41219597922'
permissions:
  contents: write
  actions: read
jobs:
  pack:
    if: github.ref == 'refs/heads/codex/web-android-windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          pattern: HushNest-sleep-source-*
          merge-multiple: true
          path: build/long-sleep-sources
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install numpy==2.5.4 imageio-ffmpeg==0.7.0
      - run: python cross-platform/scripts/prepare-sleep-audio.py
      - run: python cross-platform/scripts/prepare-sleep-audio.py --verify
      - name: Commit the verified generated pack to the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cross-platform/assets/sleep
          git commit -m 'Generate long CC0 sleep audio pack with circular crossfades'
          git push origin HEAD:codex/web-android-windows
