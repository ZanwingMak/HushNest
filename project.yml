name: HushNest
options:
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: 2Q2LMV7BR6
    CODE_SIGN_STYLE: Automatic
targets:
  HushNest:
    type: application
    platform: iOS
    sources: [HushNest]
    info:
      path: HushNest/Resources/Info.plist
      properties:
        CFBundleDisplayName: 耳憩
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zanwingmak.HushNest
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  HushNestTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HushNestTests]
    dependencies:
      - target: HushNest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HushNestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HushNestUITests]
    dependencies:
      - target: HushNest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HushNest:
    build:
      targets:
        HushNest: all
        HushNestTests: [test]
        HushNestUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - HushNestTests
        - HushNestUITests
    archive:
      config: Release
